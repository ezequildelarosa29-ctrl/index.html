<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sheets CRUD App</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h2 class="text-center mb-4">Google Sheets CRUD Operations</h2>

        <!-- Form Card -->
        <div class="card shadow mb-4">
            <div class="card-header bg-primary text-white" id="form-title">Add New Record</div>
            <div class="card-body">
                <form id="crudForm">
                    <input type="hidden" id="recordId">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone</label>
                        <input type="text" class="form-control" id="phone" required>
                    </div>
                    <button type="submit" class="btn btn-success" id="saveBtn">Save Record</button>
                    <button type="button" class="btn btn-secondary d-none" id="cancelBtn" onclick="resetForm()">Cancel</button>
                </form>
            </div>
        </div>

        <!-- Table Card -->
        <div class="card shadow">
            <div class="card-header bg-secondary text-white">Records List</div>
            <div class="card-body">
                <div id="loading" class="text-center">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p>Loading data from Google Sheets...</p>
                </div>
                <div class="table-responsive">
                    <table class="table table-bordered table-striped d-none" id="dataTable">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th class="text-center" style="width: 150px;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Dynamic Rows Go Here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // REPLACE WITH YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL
        const scriptURL = "19ecsUumIX3arlUVyOQNa_qW1e9y5W7-JdlD3LyEDrUY";

        const form = document.getElementById("crudForm");
        const tableBody = document.getElementById("tableBody");
        const dataTable = document.getElementById("dataTable");
        const loading = document.getElementById("loading");
        const formTitle = document.getElementById("form-title");
        const saveBtn = document.getElementById("saveBtn");
        const cancelBtn = document.getElementById("cancelBtn");

        // Load records on page startup
        document.addEventListener("DOMContentLoaded", fetchRecords);

        // Handle Form Submit (Create & Update)
        form.addEventListener("submit", e => {
            e.preventDefault();
            const id = document.getElementById("recordId").value;
            const action = id ? "update" : "create";
            
            let urlData = `${scriptURL}?action=${action}&name=${encodeURIComponent(document.getElementById("name").value)}&email=${encodeURIComponent(document.getElementById("email").value)}&phone=${encodeURIComponent(document.getElementById("phone").value)}`;
            
            if (id) {
                urlData += `&id=${id}`;
            }

            saveBtn.disabled = true;
            saveBtn.innerText = "Saving...";

            fetch(urlData)
                .then(response => response.json())
                .then(data => {
                    if (data.result === "success") {
                        resetForm();
                        fetchRecords();
                    } else {
                        alert("Error: " + data.message);
                    }
                    saveBtn.disabled = false;
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    saveBtn.disabled = false;
                    saveBtn.innerText = "Save Record";
                });
        });

        // Read / Fetch Records
        function fetchRecords() {
            loading.classList.remove("d-none");
            dataTable.classList.add("d-none");

            fetch(`${scriptURL}?action=read`)
                .then(response => response.json())
                .then(data => {
                    tableBody.innerHTML = "";
                    data.forEach(row => {
                        tableBody.innerHTML += `
                            <tr>
                                <td>${row.name}</td>
                                <td>${row.email}</td>
                                <td>${row.phone}</td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-warning me-1" onclick="editRecord('${row.id}', '${row.name}', '${row.email}', '${row.phone}')">Edit</button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteRecord('${row.id}')">Delete</button>
                                </td>
                            </tr>
                        `;
                    });
                    loading.classList.add("d-none");
                    dataTable.classList.remove("d-none");
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    loading.innerText = "Failed to load data.";
                });
        }

        // Prepare Form for Editing
        function editRecord(id, name, email, phone) {
            document.getElementById("recordId").value = id;
            document.getElementById("name").value = name;
            document.getElementById("email").value = email;
            document.getElementById("phone").value = phone;

            formTitle.innerText = "Edit Record";
            saveBtn.innerText = "Update Record";
            saveBtn.className = "btn btn-warning";
            cancelBtn.classList.remove("d-none");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Delete Record
        function deleteRecord(id) {
            if (confirm("Are you sure you want to delete this record?")) {
                loading.classList.remove("d-none");
                fetch(`${scriptURL}?action=delete&id=${id}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.result === "success") {
                            fetchRecords();
                        } else {
                            alert("Delete failed.");
                        }
                    })
                    .catch(error => console.error('Error!', error.message));
            }
        }

        // Reset Form State
        function resetForm() {
            form.reset();
            document.getElementById("recordId").value = "";
            formTitle.innerText = "Add New Record";
            saveBtn.innerText = "Save Record";
            saveBtn.className = "btn btn-success";
            cancelBtn.classList.add("d-none");
        }
    </script>
</body>
</html>
